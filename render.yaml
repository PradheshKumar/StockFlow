services:
  - type: web
    name: stockflow
    runtime: node
    region: oregon

    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: node server/src/index.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://stockflow.onrender.com
